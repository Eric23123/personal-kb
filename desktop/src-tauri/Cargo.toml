[package]
name = "personal-kb"
version = "0.1.0"
description = "Personal knowledge base desktop workspace"
authors = ["Personal-KB"]
edition = "2021"

[lib]
name = "personal_kb_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
chrono = "0.4"
keyring = { version = "3.6", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-opener = "2.2"
